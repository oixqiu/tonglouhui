baseURL = "https://oixqiu.github.io/tonglouhui/"
title = "语音博客"
theme = "PaperMod"
hasCJKLanguage = true
defaultContentLanguage = "zh"

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.homeInfoParams]
  Title = "语音博客"
  Content = "这里的每篇文章，都来自一段语音。"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = "归档"
  url = "archives/"
  weight = 5
[[menu.main]]
  name = "标签"
  url = "tags/"
  weight = 10
